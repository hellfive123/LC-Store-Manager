<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC Store | Quản Trị Doanh Thu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Ẩn thanh cuộn cho bảng gọn hơn */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a', /* Slate 900 */
                        secondary: '#334155', /* Slate 700 */
                        accent: '#4f46e5', /* Indigo 600 */
                        success: '#10b981', /* Emerald 500 */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">

	<nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-2 md:gap-3">
                    <div class="bg-primary text-white p-1.5 md:p-2 rounded-lg">
                        <i class="fas fa-cube text-lg md:text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg md:text-xl font-bold text-primary tracking-tight">LC Store</h1>
                        <p class="text-[10px] md:text-xs text-slate-500 font-medium hidden md:block">Revenue Dashboard</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="settleAll()" class="flex items-center gap-1 md:gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs md:text-sm font-medium transition whitespace-nowrap">
                        <i class="fas fa-history"></i> 
                        <span>Reset</span>
                    </button>
                    
                    <button onclick="exportToExcel()" class="flex items-center gap-1 md:gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-medium shadow-sm transition whitespace-nowrap">
                        <i class="fas fa-file-export"></i> 
                        <span class="hidden md:inline">Excel</span> <span class="inline md:hidden">Xuất</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500 uppercase tracking-wider">Hôm nay</p>
                    <p id="profitToday" class="text-2xl font-bold text-slate-800 mt-1">0</p>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-full">
                    <i class="fas fa-calendar-day text-xl"></i>
                </div>
            </div>
            
            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500 uppercase tracking-wider">Tháng này</p>
                    <p id="profitMonth" class="text-2xl font-bold text-accent mt-1">0</p>
                </div>
                <div class="p-3 bg-indigo-50 text-accent rounded-full">
                    <i class="fas fa-chart-line text-xl"></i>
                </div>
            </div>

            <div class="bg-primary rounded-xl p-6 shadow-lg shadow-slate-300 flex items-center justify-between text-white">
                <div>
                    <p class="text-sm font-medium text-slate-300 uppercase tracking-wider">Tổng Lợi Nhuận</p>
                    <p id="profitTotal" class="text-2xl font-bold mt-1">0</p>
                </div>
                <div class="p-3 bg-slate-700 rounded-full text-emerald-400">
                    <i class="fas fa-coins text-xl"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="space-y-6">
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                        <h3 id="formTitle" class="font-semibold text-slate-800">Giao Dịch Mới</h3>
                        <button id="btnCancel" onclick="cancelEdit()" class="hidden text-xs text-red-500 hover:text-red-700 font-bold uppercase">Hủy</button>
                    </div>
                    <div class="p-6 space-y-5">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Giá Gốc (x1.000)</label>
                                <input type="number" id="cost" oninput="previewValue('cost', 'costPreview')" 
                                    class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition font-medium text-slate-700" placeholder="VD: 1">
                                <p id="costPreview" class="text-xs text-slate-400 mt-1 h-4 text-right"></p>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Giá Bán (x1.000)</label>
                                <input type="number" id="price" oninput="previewValue('price', 'pricePreview')"
                                    class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition font-medium text-slate-700" placeholder="VD: 10">
                                <p id="pricePreview" class="text-xs text-emerald-600 font-bold mt-1 h-4 text-right"></p>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Mô tả / Tên Game</label>
                            <input type="text" id="note" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition text-slate-700" placeholder="Nhập nội dung...">
                        </div>

                        <button id="btnSubmit" onclick="saveTransaction()" class="w-full bg-primary hover:bg-slate-800 text-white font-bold py-3.5 rounded-lg shadow-md hover:shadow-lg transition transform active:scale-95">
                            <i class="fas fa-plus mr-2"></i> Thêm Giao Dịch
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Phân Chia Lợi Nhuận</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-indigo-200 flex items-center justify-center text-indigo-700 font-bold text-xs">C</div>
                                <span class="font-semibold text-slate-700">Cường</span>
                            </div>
                            <span id="totalCuong" class="font-bold text-indigo-700 text-lg">0 ₫</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-pink-50 rounded-lg border border-pink-100">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-pink-200 flex items-center justify-center text-pink-700 font-bold text-xs">L</div>
                                <span class="font-semibold text-slate-700">Long</span>
                            </div>
                            <span id="totalLong" class="font-bold text-pink-600 text-lg">0 ₫</span>
                        </div>
                    </div>
                    <p class="text-xs text-center text-slate-400 mt-3 italic">Công thức: Cường = Gốc + 50% Lời | Long = 50% Lời</p>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden h-[600px]">
                <div class="bg-white px-6 py-4 border-b border-slate-200 flex justify-between items-center sticky top-0">
                    <h3 class="font-semibold text-slate-800">Lịch Sử Giao Dịch</h3>
                    
                    <div class="flex items-center bg-slate-100 rounded-md px-2 py-1">
                        <input type="month" id="deleteMonthInput" class="bg-transparent border-none text-xs text-slate-600 focus:ring-0 outline-none p-1">
                        <button onclick="deleteByMonth()" class="ml-2 text-slate-400 hover:text-red-500 transition">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-auto">
                    <table class="w-full text-left border-collapse" id="mainTable">
                        <thead class="bg-slate-50 sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">Thời gian</th>
                                <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">Nội dung</th>
                                <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200 text-right">Giá trị</th>
                                <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200 text-right">Lợi nhuận</th>
                                <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200 text-center">#</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100 text-sm text-slate-600">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer class="text-center text-slate-400 text-xs mt-10">
            © 2025 LC Store Management System
        </footer>

    </main>

    <script>
        let currentEditingId = null; 

        const formatCurrency = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

        const previewValue = (inputId, previewId) => {
            const val = document.getElementById(inputId).value;
            document.getElementById(previewId).innerText = val ? `${formatCurrency(val * 1000)}` : '';
        }

        const renderData = (transactions) => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let totalProfit = 0, totalCuong = 0, totalLong = 0, profitToday = 0, profitMonth = 0;
            const now = new Date();

            if (transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400 italic">Chưa có dữ liệu giao dịch</td></tr>`;
            }

            transactions.forEach(t => {
                const profit = t.price - t.cost;
                const date = new Date(t.created_at);

                totalProfit += profit;
                totalCuong += (t.cost + profit / 2);
                totalLong += (profit / 2);

                if (date.toDateString() === now.toDateString()) profitToday += profit;
                if (date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear()) profitMonth += profit;

                const tr = `
                    <tr class="hover:bg-slate-50 transition group">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="block font-medium text-slate-700">${date.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})}</span>
                            <span class="text-xs text-slate-400">${date.toLocaleDateString('vi-VN')}</span>
                        </td>
                        <td class="px-6 py-4 font-medium text-slate-800">${t.note}</td>
                        <td class="px-6 py-4 text-right whitespace-nowrap">
                            <div class="text-xs text-slate-400">Gốc: ${formatCurrency(t.cost)}</div>
                            <div class="text-slate-600 font-medium">Bán: ${formatCurrency(t.price)}</div>
                        </td>
                        <td class="px-6 py-4 text-right font-bold text-emerald-600 whitespace-nowrap bg-emerald-50/30">
                            +${formatCurrency(profit)}
                        </td>
                        <td class="px-6 py-4 text-center whitespace-nowrap">
                            <div class="invisible group-hover:visible flex justify-center gap-2">
                                <button onclick="editTransaction(${t.id}, ${t.cost}, ${t.price}, '${t.note}')" class="w-8 h-8 rounded flex items-center justify-center text-blue-600 hover:bg-blue-100 bg-blue-50 transition"><i class="fas fa-pen text-xs"></i></button>
                                <button onclick="deleteTransaction(${t.id})" class="w-8 h-8 rounded flex items-center justify-center text-red-500 hover:bg-red-100 bg-red-50 transition"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });

            // Update Stats
            document.getElementById('totalCuong').innerText = formatCurrency(totalCuong);
            document.getElementById('totalLong').innerText = formatCurrency(totalLong);
            document.getElementById('profitTotal').innerText = formatCurrency(totalProfit);
            document.getElementById('profitToday').innerText = formatCurrency(profitToday);
            document.getElementById('profitMonth').innerText = formatCurrency(profitMonth);
        }

        const fetchTransactions = async () => {
            try {
                const res = await axios.get('/api/transactions');
                renderData(res.data.data);
            } catch (error) { console.error(error); }
        }

        const saveTransaction = async () => {
            let cost = document.getElementById('cost').value;
            let price = document.getElementById('price').value;
            const note = document.getElementById('note').value;
            if (!price || !cost) return alert("Vui lòng nhập đủ giá gốc và giá bán");
            
            cost = Number(cost) * 1000;
            price = Number(price) * 1000;

            try {
                if (currentEditingId) {
                    await axios.put(`/api/transactions/${currentEditingId}`, { cost, price, note });
                    cancelEdit();
                } else {
                    await axios.post('/api/transactions', { cost, price, note });
                }
                resetForm();
                fetchTransactions();
            } catch (error) { console.error(error); }
        }

        const editTransaction = (id, cost, price, note) => {
            currentEditingId = id;
            document.getElementById('cost').value = cost / 1000;
            document.getElementById('price').value = price / 1000;
            document.getElementById('note').value = note;
            
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<i class="fas fa-save mr-2"></i> Cập nhật';
            btn.classList.remove('bg-primary');
            btn.classList.add('bg-accent');
            
            document.getElementById('formTitle').innerText = `Sửa giao dịch #${id}`;
            document.getElementById('formTitle').classList.add('text-accent');
            document.getElementById('btnCancel').classList.remove('hidden');
            
            previewValue('cost', 'costPreview');
            previewValue('price', 'pricePreview');
            document.getElementById('cost').focus();
        }

        const cancelEdit = () => {
            currentEditingId = null;
            resetForm();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<i class="fas fa-plus mr-2"></i> Thêm Giao Dịch';
            btn.classList.add('bg-primary');
            btn.classList.remove('bg-accent');
            
            document.getElementById('formTitle').innerText = 'Giao Dịch Mới';
            document.getElementById('formTitle').classList.remove('text-accent');
            document.getElementById('btnCancel').classList.add('hidden');
        }

        const resetForm = () => {
            document.getElementById('cost').value = '';
            document.getElementById('price').value = '';
            document.getElementById('note').value = '';
            document.getElementById('costPreview').innerText = '';
            document.getElementById('pricePreview').innerText = '';
        }

        const deleteTransaction = async (id) => {
            if(confirm("Xóa dòng này?")) {
                await axios.delete(`/api/transactions/${id}`);
                fetchTransactions();
            }
        }

        const deleteByMonth = async () => {
            const val = document.getElementById('deleteMonthInput').value;
            if (!val) return alert("Chọn tháng cần xóa");
            const [year, month] = val.split('-');
            if (confirm(`Xóa sạch tháng ${month}/${year}?`)) {
                await axios.post('/api/delete-month', { month, year });
                fetchTransactions();
            }
        }

        const settleAll = async () => {
            if (confirm("CHỐT SỔ: Hành động này sẽ ẩn toàn bộ dữ liệu hiện tại để bắt đầu chu kỳ mới?")) {
                await axios.post('/api/settle');
                fetchTransactions();
            }
        }

        const exportToExcel = () => {
            const table = document.getElementById("mainTable");
            const wb = XLSX.utils.table_to_book(table, {sheet: "Doanh Thu"});
            XLSX.writeFile(wb, `LCStore_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        fetchTransactions();
    </script>
</body>
</html>
